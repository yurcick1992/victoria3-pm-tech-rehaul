l_russian:
# AUTO-GENERATED by tools/emit_techs.mjs — English strings are used as stubs for all languages.
 beet_sugar_refining:0 "Beet Sugar Refining"
 beet_sugar_refining_desc:0 "Marggraf and Achard's beet process frees the sugar trade from the cane colonies, and puts a refinery within reach of any temperate country with a food industry."
 calico_printing:0 "Calico Printing"
 calico_printing_desc:0 "Roller printing and the integrated dye works turn cloth finishing from a craft into a chemical trade, and make patterned cloth a mass commodity."
 fourdrinier_machine:0 "Fourdrinier Machine"
 fourdrinier_machine_desc:0 "Continuous web papermaking replaces the vatman's mould. Paper stops being sold by the sheet and starts being sold by the mile."
 leblanc_process:0 "Leblanc Process"
 leblanc_process_desc:0 "Soda from salt and sulfuric acid founds the heavy chemical trade — and with it the first works able to make explosives on an industrial scale."
 deep_water_docks:0 "Deep Water Docks"
 deep_water_docks_desc:0 "Hydraulic cranes, dredged approaches and enclosed basins let a port handle an iron steamer of a draught no tidal quay could ever take."
 explosive_shells:0 "Filled Explosive Shells"
 explosive_shells_desc:0 "Shells filled and fused on a production line rather than in a laboratory, in quantities a siege can actually spend."
 regenerative_furnace:0 "Regenerative Furnace"
 regenerative_furnace_desc:0 "Siemens' heat-recovery tank furnace runs continuously instead of in pots, halving the fuel a glasshouse burns for every ton it melts."
 steel_hulls:0 "Steel Hulls"
 steel_hulls_desc:0 "Mild steel plate is stronger than iron for the same weight, so the same hull carries more cargo or more armour, and the yard's berths are laid out for a material that will not be replaced this century."
 concrete_quays:0 "Reinforced Concrete Quays"
 concrete_quays_desc:0 "Monolithic concrete replaces the timber pile and the masonry block, and a berth can be built where no quarry could ever have supplied one."
 fat_hydrogenation:0 "Fat Hydrogenation"
 fat_hydrogenation_desc:0 "Normann's nickel catalyst hardens cheap liquid oils into a solid cooking fat, and the food industry stops depending on animal tallow and the dairy herd."
 high_speed_steel:0 "High Speed Steel"
 high_speed_steel_desc:0 "Taylor and White's tungsten steel cuts red-hot without losing its edge. Machine shop speeds go from five metres a minute to thirty."
 kraft_process:0 "Kraft Process"
 kraft_process_desc:0 "Sulfate pulping digests resinous softwoods that sulfite cannot touch, and recovers its own chemicals — the strongest and cheapest pulp yet made."
 marine_steam_turbine:0 "Marine Steam Turbine"
 marine_steam_turbine_desc:0 "Parsons' turbine at sea: fewer moving parts, no reciprocating mass, and speeds a triple-expansion engine cannot reach."
 ostwald_process:0 "Ostwald Process"
 ostwald_process_desc:0 "Catalytic oxidation of ammonia makes nitric acid without a nitrate mine, and cuts the last colonial tether on the explosives trade."
 recoil_carriages:0 "Recoil Carriages"
 recoil_carriages_desc:0 "The French 75's hydro-pneumatic recoil keeps the barrel on target between rounds, and multiplies a battery's rate of fire."
 rotary_veneer:0 "Rotary-Cut Veneer"
 rotary_veneer_desc:0 "Peeling a log on a rotary lathe and gluing the sheets crosswise gives a panel stronger than the timber it came from, and furniture stops being carpentry and starts being assembly."
 synthetic_indigo:0 "Synthetic Indigo"
 synthetic_indigo_desc:0 "Seventeen years and a fortune later, BASF sells indigo made from coal tar — and the Bengal indigo districts have nothing left to sell."
 wireless_telegraphy:0 "Wireless Telegraphy"
 wireless_telegraphy_desc:0 "Spark transmitters put a telegraph office on a ship and then across an ocean, and the electrical trade acquires a product that needs no line at all."
 autofrettage:0 "Autofrettage"
 autofrettage_desc:0 "Pre-stressing a barrel from within replaces built-up hoop construction — a lighter gun of the same power, made in fewer operations."
 cemented_carbide:0 "Cemented Carbide"
 cemented_carbide_desc:0 "Tungsten carbide sintered in cobalt cuts four to seven times faster than high speed steel, and wears out far more slowly."
 diesel_engine:0 "Diesel Engine"
 diesel_engine_desc:0 "Compression ignition burns a fuel no boiler would take, at an efficiency no steam plant can reach, in a works that can build one to order."
 light_machine_guns:0 "Light Machine Guns"
 light_machine_guns_desc:0 "An automatic weapon a section can carry moves sustained fire from the strongpoint into the assault, and the arms industry starts making mechanisms rather than barrels."
 long_draft_spinning:0 "Long-Draft Spinning"
 long_draft_spinning_desc:0 "Drafting the roving further in one passage removes whole banks of machinery from the spinning room, and with individual electric drive the mill is rebuilt around the operative rather than the shaft."
 mechanised_cargo_handling:0 "Mechanised Cargo Handling"
 mechanised_cargo_handling_desc:0 "Travelling gantries, conveyors and motor trucks on the quay. A motor ship's turnaround is measured in days rather than weeks."
 oil_fired_boilers:0 "Oil-Fired Boilers"
 oil_fired_boilers_desc:0 "Oil firing halves the stokehold crew and doubles the range. The yard's customers stop specifying coal bunkers."
 pulverized_coal_firing:0 "Pulverized Coal Firing"
 pulverized_coal_firing_desc:0 "Coal ground to flour and blown into the furnace burns like a gas. Station units jump from single megawatts to tens of them."
 ribbon_machine:0 "Ribbon Machine"
 ribbon_machine_desc:0 "Corning's ribbon machine blows bulbs from a moving ribbon of glass at a rate no gathering machine can approach."
 semi_chemical_pulping:0 "Semi-Chemical Pulping"
 semi_chemical_pulping_desc:0 "A mild sulfite cook followed by mechanical defibring opens hardwoods the chemical mills could not use, and the corrugated box gets a cheap domestic furnish."
 shell_filling:0 "Mass Shell Filling"
 shell_filling_desc:0 "The filling factory is a distinct industry from the case plant: acres of separated sheds, women's labour at scale, and an output measured in millions of rounds a week."
 automatic_aa_guns:0 "Automatic Anti-Aircraft Guns"
 automatic_aa_guns_desc:0 "A fast-traversing automatic gun on a welded mounting, laid by a mechanical director, is the first artillery designed for a target that moves faster than the shell's flight time."
 continuous_strip_mill:0 "Continuous Wide Strip Mill"
 continuous_strip_mill_desc:0 "Armco's continuous mill rolls a coil of wide sheet in one pass. It is the largest single step interwar steel takes, and vanilla has no tier for it at all."
 cyclonite_process:0 "Cyclonite Process"
 cyclonite_process_desc:0 "Nitrating hexamine gives an explosive half again as powerful as TNT, and continuous plant makes it in quantities that change what a bomb and a torpedo can do."
 glass_fibre:0 "Glass Fibre"
 glass_fibre_desc:0 "Glass drawn continuously into filaments finer than wool is no longer a glazing material at all — it insulates, reinforces and filters, and the glassworks acquires a market that has nothing to do with windows."
 high_speed_diesel:0 "High Speed Diesel"
 high_speed_diesel_desc:0 "Welded frames and light alloys take the diesel from a stationary engine to something a lorry, a locomotive or a submarine can carry."
 high_speed_papermaking:0 "High Speed Papermaking"
 high_speed_papermaking_desc:0 "Suction presses, steam drying and precision drives take the Fourdrinier past a quarter mile of paper a minute."
 polyamide_synthesis:0 "Polyamide Synthesis"
 polyamide_synthesis_desc:0 "Carothers' nylon is the first fibre owing nothing to a plant or an animal — and the first that competes with silk on its own terms."
 sound_film:0 "Sound Film"
 sound_film_desc:0 "Synchronised sound, and then colour. The academy's product stops being a picture and becomes a performance."
 stamped_receivers:0 "Mass Small-Arms Production"
 stamped_receivers_desc:0 "Pressed and welded sheet metal in place of milled forgings. A weapon a bicycle works can make, in the numbers a war needs."
 steam_reforming:0 "Steam Reforming"
 steam_reforming_desc:0 "Hydrogen from methane instead of coke. The ammonia plant sheds its gasworks and its coal yard together."
 transfer_machining:0 "Automatic Machine Control"
 transfer_machining_desc:0 "Workpieces are indexed automatically from station to station. The assembly line finally reaches the machine shop feeding it."
 vacuum_tube_electronics:0 "Vacuum Tube Electronics"
 vacuum_tube_electronics_desc:0 "Amplification makes the valve a component rather than a curiosity, and turns the telephone works into an electronics industry."
 welded_prefabrication:0 "Welded Prefabrication"
 welded_prefabrication_desc:0 "Hulls assembled from pre-welded sections built inland turn shipbuilding into an assembly industry, and a merchant ship from a two-year commission into a two-month one."
 crystal_glass:0 "Lead Crystal"
 aniline:0 "Coal-Tar Chemistry"
 percussion_cap:0 "Percussion Ordnance"
 screw_frigate:0 "The Screw Steamer"
 steel_railway_cars:0 "Bulk Steel"
 watertube_boiler:0 "High-Pressure Steam"
 bolt_action_rifles:0 "Magazine Rifles"
 electric_railway:0 "Electric Drive"
 electrical_capacitors:0 "Alternating Current"
 pumpjacks:0 "Oil Drilling"
 threshing_machine:0 "Steam Threshing"
 art_silk:0 "Cellulose Esters"
 conveyors:0 "Continuous-Flow Production"
 dough_rollers:0 "Mechanised Bakeries"
