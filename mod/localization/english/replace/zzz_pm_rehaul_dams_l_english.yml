 state_trait_pmr_basin_irrigation:0 "Basin Irrigation"
 state_trait_pmr_basin_irrigation_desc:0 "The Nile flood waters these fields once a year. Without storage there is no summer crop, and the land yields well below the perennially irrigated Delta. A storage dam upstream would end this."
 state_trait_pmr_rainfed_plain:0 "Rain-fed Plain"
 state_trait_pmr_rainfed_plain_desc:0 "Between the two Niles the plain is farmed on uncertain summer rains and grazed; the river irrigates only a narrow strip. A storage dam upstream would end this."
 state_trait_pmr_steppe_irrigation:0 "Steppe Irrigation"
 state_trait_pmr_steppe_irrigation_desc:0 "Canals from the great reservoir water the dry steppe, taking the edge off its droughts."
 state_trait_pmr_flood_control:0 "River Flood Control"
 state_trait_pmr_flood_control_desc:0 "A chain of storage dams holds back the spring floods that used to drown the valley bottoms."
 state_trait_pmr_flood_control_minor:0 "Partial Flood Control"
 state_trait_pmr_flood_control_minor_desc:0 "Storage dams upstream and on this reach hold back the worst of the floods."
